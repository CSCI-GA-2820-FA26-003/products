apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: products-cd
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/CSCI-GA-2820-FA26-003/products.git
    - name: repo-revision
      type: string
      default: master
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/dj2748-dev/products:latest
    - name: base-url
      type: string
      default: https://products-dj2748-dev.apps.rm1.0a51.p1.openshiftapps.com
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.repo-revision)
        - name: subdirectory
          value: ""

    - name: lint
      runAfter: [clone]
      taskRef:
        name: lint
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      runAfter: [clone]
      taskRef:
        name: test
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build
      runAfter: [lint, test]
      taskRef:
        name: buildah
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image)

    - name: deploy
      runAfter: [build]
      taskRef:
        name: deploy
      params:
        - name: image
          value: $(params.image)

    - name: bdd
      runAfter: [deploy]
      taskRef:
        name: bdd
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: BASE_URL
          value: $(params.base-url)
