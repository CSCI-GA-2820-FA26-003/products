 <!DOCTYPE html>
   <html>
     <head>
       <title>Products Service Admin</title>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1">
       <link rel="icon" type="image/x-icon" href="static/images/newapp-icon.png">
       <link rel="stylesheet" href="static/css/cerulean_bootstrap.min.css">
     </head>
     <body>
       <div class="container">
         <div class="page-header">
           <h1>Product Admin</h1>
         </div>

         <!-- Flash Message -->
         <table class="table">
           <tr><td>Status:</td><td><span id="flash_message"></span></td></tr>
         </table>

         <!-- FORM -->
         <div class="col-md-12" id="form_data">
           <h3>Create, Retrieve, Update, and Delete a Product:</h3>
           <div class="well">
             <div class="form-horizontal">
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_id">Product ID:</label>
                 <div class="col-sm-6">
                   <input type="text" class="form-control" id="product_id" placeholder="Enter ID of Product">
                 </div>
                 <div class="col-sm-4">
                   <button type="submit" class="btn btn-primary" id="retrieve-btn">Retrieve</button>
                   <button type="submit" class="btn btn-danger" id="delete-btn">Delete</button>
                 </div>
               </div>
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_name">Name:</label>
                 <div class="col-sm-10">
                   <input type="text" class="form-control" id="product_name" placeholder="Enter name">
                 </div>
               </div>
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_description">Description:</label>
                 <div class="col-sm-10">
                   <input type="text" class="form-control" id="product_description" placeholder="Enter description">
                 </div>
               </div>
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_category">Category:</label>
                 <div class="col-sm-10">
                   <input type="text" class="form-control" id="product_category" placeholder="Enter category">
                 </div>
               </div>
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_price">Price:</label>
                 <div class="col-sm-10">
                   <input type="text" class="form-control" id="product_price" placeholder="Enter price">
                 </div>
               </div>
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_stock">Stock:</label>
                 <div class="col-sm-10">
                   <input type="text" class="form-control" id="product_stock" placeholder="Enter stock">
                 </div>
               </div>
               <div class="form-group">
                 <label class="control-label col-sm-2" for="product_image_url">Image URL:</label>
                 <div class="col-sm-10">
                   <input type="text" class="form-control" id="product_image_url" placeholder="Enter image URL">
                 </div>
               </div>
               <div class="form-group">
                 <div class="col-sm-offset-2 col-sm-10">
                   <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
                   <button type="submit" class="btn btn-primary" id="clear-btn">Clear</button>
                   <button type="submit" class="btn btn-success" id="create-btn">Create</button>
                   <button type="submit" class="btn btn-warning" id="update-btn">Update</button>
                 </div>
               </div>
             </div>
           </div>
         </div>

         <!-- Search Results -->
         <div class="table-responsive col-md-12" id="search_results">
           <table class="table table-striped">
             <thead>
             <tr>
               <th>ID</th><th>Name</th><th>Description</th>
               <th>Category</th><th>Price</th><th>Stock</th><th>Image URL</th>
             </tr>
             </thead>
           </table>
         </div>

         <footer><br><br><p>&copy; NYU DevOps 2026</p></footer>
       </div>

       <script src="static/js/jquery-3.6.0.min.js"></script>
       <script src="static/js/bootstrap.min.js"></script>
       <script src="static/js/rest_api.js"></script>
     </body>
   </html>
